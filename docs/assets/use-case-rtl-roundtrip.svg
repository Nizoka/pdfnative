<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ucr-title ucr-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="ucr-title">Right-to-left letter in, logical-order text out</title>
  <desc id="ucr-desc">Architecture: a JSON letter with Arabic and Hebrew paragraphs under layout.direction auto is rendered by pdfnative render with --direction auto and the ar, he and latin font modules into an untagged letter.pdf, where every right-to-left run is a /Span /ActualText span carrying its logical text inside one text object per line. pdfnative extract-text --format ndjson reads the file with no extra flag — the span is applied once, as Chrome and Acrobat Reader do — and writes one JSON object per page in logical order, which a search or RAG index ingests page by page without a reversal heuristic or an OCR step. The footer names --actual-text false as the switch that drops the spans (bare runs in visual order, not the 1.8.0 bytes), and the limits: a Thai above vowel and tone mark pair and a line mixing directions extract geometrically, and watermark and form-label text carries no span.</desc>

  <defs>
    <marker id="ucr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ucr-ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="ucr-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Right-to-left letter in, logical-order text out</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">One flag sets the direction, the engine writes the spans, the index reads the letter as typed — pdfnative-cli v1.6.0</text>

  <!-- Row 1: letter.json -> render -> letter.pdf -->
  <rect x="40" y="100" width="200" height="150" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="140" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">letter.json</text>
  <text x="140" y="148" text-anchor="middle" font-size="11.5" fill="#B45309">layout.direction: auto</text>
  <text x="140" y="168" text-anchor="middle" font-size="11.5" fill="#B45309">Arabic + Hebrew paragraphs</text>
  <text x="140" y="184" text-anchor="middle" font-size="11.5" fill="#B45309">one paragraph: direction ltr</text>
  <text x="140" y="200" text-anchor="middle" font-size="11.5" fill="#B45309">a Latin closing line</text>
  <text x="140" y="228" text-anchor="middle" font-size="11.5" fill="#B45309">plain JSON, no TypeScript</text>

  <line x1="240" y1="175" x2="378" y2="175" stroke="#475569" stroke-width="1.75" marker-end="url(#ucr-ah)"/>
  <rect x="250" y="164" width="120" height="22" rx="4" fill="#F8FAFC"/>
  <text x="310" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">--input letter.json</text>

  <rect x="380" y="100" width="200" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="480" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">pdfnative render</text>
  <text x="480" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E40AF">--direction auto</text>
  <text x="480" y="168" text-anchor="middle" font-size="10.5" fill="#3B82F6">--font ar --font he --font latin</text>
  <text x="480" y="184" text-anchor="middle" font-size="10.5" fill="#3B82F6">--lang ar,he,latin</text>
  <text x="480" y="212" text-anchor="middle" font-size="11.5" fill="#3B82F6">base direction per paragraph</text>
  <text x="480" y="228" text-anchor="middle" font-size="11.5" fill="#3B82F6">(UAX #9); a block's own wins</text>

  <line x1="580" y1="175" x2="718" y2="175" stroke="#475569" stroke-width="1.75" marker-end="url(#ucr-ah)"/>
  <rect x="590" y="164" width="120" height="22" rx="4" fill="#F8FAFC"/>
  <text x="650" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">--output letter.pdf</text>

  <rect x="720" y="100" width="200" height="150" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="820" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">letter.pdf</text>
  <text x="820" y="148" text-anchor="middle" font-size="11.5" fill="#4F46E5">untagged, no PDF/A claim</text>
  <text x="820" y="168" text-anchor="middle" font-size="11.5" fill="#4F46E5">every right-to-left run is a</text>
  <text x="820" y="184" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730A3">/Span /ActualText</text>
  <text x="820" y="200" text-anchor="middle" font-size="11.5" fill="#4F46E5">carrying its logical text,</text>
  <text x="820" y="216" text-anchor="middle" font-size="11.5" fill="#4F46E5">one text object per line</text>

  <!-- letter.pdf down to extract-text -->
  <line x1="820" y1="250" x2="820" y2="314" stroke="#2563EB" stroke-width="2" marker-end="url(#ucr-ah-blue)"/>
  <rect x="775" y="271" width="90" height="22" rx="4" fill="#F8FAFC"/>
  <text x="820" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">--input</text>

  <!-- Row 2: index <- letter.ndjson <- extract-text -->
  <rect x="720" y="316" width="200" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="820" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">pdfnative extract-text</text>
  <text x="820" y="364" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E40AF">--format ndjson</text>
  <text x="820" y="384" text-anchor="middle" font-size="11.5" fill="#3B82F6">no flag for the spans:</text>
  <text x="820" y="400" text-anchor="middle" font-size="11.5" fill="#3B82F6">applied once, as Chrome</text>
  <text x="820" y="416" text-anchor="middle" font-size="11.5" fill="#3B82F6">and Acrobat Reader do</text>
  <text x="820" y="444" text-anchor="middle" font-size="11.5" fill="#3B82F6">--on-stream-error limit (default)</text>

  <line x1="720" y1="391" x2="582" y2="391" stroke="#16A34A" stroke-width="2" marker-end="url(#ucr-ah-green)"/>
  <rect x="615" y="380" width="70" height="22" rx="4" fill="#F8FAFC"/>
  <text x="650" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">stdout</text>

  <rect x="380" y="316" width="200" height="150" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="480" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">letter.ndjson</text>
  <text x="480" y="364" text-anchor="middle" font-size="11" fill="#16A34A">{ "pageIndex": 0, "text": … }</text>
  <text x="480" y="384" text-anchor="middle" font-size="11.5" fill="#16A34A">one object per page</text>
  <text x="480" y="400" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">logical order, as typed</text>
  <text x="480" y="416" text-anchor="middle" font-size="11.5" fill="#16A34A">no reversal heuristic</text>
  <text x="480" y="444" text-anchor="middle" font-size="11.5" fill="#16A34A">--runs adds x, y, fontSize</text>

  <line x1="380" y1="391" x2="242" y2="391" stroke="#16A34A" stroke-width="2" marker-end="url(#ucr-ah-green)"/>
  <rect x="275" y="380" width="70" height="22" rx="4" fill="#F8FAFC"/>
  <text x="310" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">ingest</text>

  <rect x="40" y="316" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="140" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Search / RAG index</text>
  <text x="140" y="364" text-anchor="middle" font-size="11.5" fill="#64748B">one chunk per page</text>
  <text x="140" y="384" text-anchor="middle" font-size="11.5" fill="#64748B">the Arabic line as typed,</text>
  <text x="140" y="400" text-anchor="middle" font-size="11.5" fill="#64748B">the Hebrew line as typed</text>
  <text x="140" y="428" text-anchor="middle" font-size="11.5" fill="#64748B">no OCR step, no post-fix</text>
  <text x="140" y="444" text-anchor="middle" font-size="11.5" fill="#64748B">for the writing direction</text>

  <!-- Footer -->
  <rect x="40" y="486" width="880" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="510" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">--actual-text false drops the spans (bare runs, visual order; not the 1.8.0 bytes) — the one switch, named in the envelope.</text>
  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#475569">Limits: a Thai vowel + tone mark pair and a mixed-direction line extract geometrically; watermarks and form labels carry no span.</text>
</svg>
