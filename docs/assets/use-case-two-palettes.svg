<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="uctp-title uctp-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="uctp-title">One component tree, two palettes: screen PDF/A and press PDF/X-4</title>
  <desc id="uctp-desc">Architecture: one Sheet component tree receives a palette prop and is rendered twice. The first wrapper is a Document with tagged set to pdfa2b and the screen palette in hex; it produces the portal PDF, a tagged PDF/A-2b file under the built-in sRGB output intent. The second wrapper is a Document with pdfx set to pdfx4, a CMYK ICC output intent, trapped set to False and print bleed with crop marks and colour bars; it receives the press palette as CMYK tuples and produces the press PDF. A guard labelled L_CMYK_INTENT_MISMATCH sits on the screen path: a CMYK value that leaks into the PDF/A render is a lint warning, mirroring the engine diagnostic PDFA_DEVICE_CMYK_CONTENT.</desc>

  <defs>
    <marker id="uctp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="uctp-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="uctp-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">One component tree, two palettes</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">Screen PDF/A-2b and press PDF/X-4 from the same &lt;Sheet&gt; — pdfnative-react v1.3.0</text>

  <!-- Shared tree -->
  <rect x="40" y="200" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="140" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">&lt;Sheet p={palette} /&gt;</text>
  <text x="140" y="254" text-anchor="middle" font-size="11.5" fill="#64748B">one component tree</text>
  <text x="140" y="272" text-anchor="middle" font-size="11.5" fill="#64748B">headings, paragraphs, tables</text>
  <text x="140" y="290" text-anchor="middle" font-size="11.5" fill="#64748B">every color prop reads the palette</text>

  <!-- Palettes -->
  <rect x="290" y="110" width="170" height="64" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="375" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">palette.screen</text>
  <text x="375" y="156" text-anchor="middle" font-size="11.5" fill="#4F46E5">'#111827', '#2563EB'</text>

  <rect x="290" y="346" width="170" height="64" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="375" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">palette.press</text>
  <text x="375" y="392" text-anchor="middle" font-size="11.5" fill="#4F46E5">[0, 0, 0, 100], [100, 60, 0, 0]</text>

  <!-- Tree → palettes -->
  <path d="M240 236 C 262 236, 262 142, 288 142" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#uctp-ah)"/>
  <path d="M240 284 C 262 284, 262 378, 288 378" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#uctp-ah)"/>

  <!-- Palettes → wrappers -->
  <line x1="460" y1="142" x2="508" y2="142" stroke="#475569" stroke-width="1.75" marker-end="url(#uctp-ah)"/>
  <line x1="460" y1="378" x2="508" y2="378" stroke="#475569" stroke-width="1.75" marker-end="url(#uctp-ah)"/>

  <!-- Screen wrapper -->
  <rect x="510" y="96" width="260" height="92" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="640" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">&lt;Document tagged="pdfa2b"&gt;</text>
  <text x="640" y="144" text-anchor="middle" font-size="11.5" fill="#3B82F6">tagged PDF/A-2b, embedded fonts</text>
  <text x="640" y="162" text-anchor="middle" font-size="11.5" fill="#3B82F6">built-in sRGB output intent</text>

  <!-- Press wrapper -->
  <rect x="510" y="316" width="260" height="124" rx="10" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="640" y="342" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155E75">&lt;Document pdfx="pdfx4"&gt;</text>
  <text x="640" y="364" text-anchor="middle" font-size="11.5" fill="#0E7490">outputIntent: CMYK ICC (prtr)</text>
  <text x="640" y="382" text-anchor="middle" font-size="11.5" fill="#0E7490">metadata.trapped: 'False'</text>
  <text x="640" y="400" text-anchor="middle" font-size="11.5" fill="#0E7490">print: bleed 14.17 pt, crop marks,</text>
  <text x="640" y="418" text-anchor="middle" font-size="11.5" fill="#0E7490">colour bars in the bleed strip</text>

  <!-- Wrappers → outputs -->
  <line x1="770" y1="142" x2="816" y2="142" stroke="#16A34A" stroke-width="2" marker-end="url(#uctp-ah-green)"/>
  <line x1="770" y1="378" x2="816" y2="378" stroke="#16A34A" stroke-width="2" marker-end="url(#uctp-ah-green)"/>

  <rect x="818" y="110" width="110" height="64" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="873" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">portal PDF</text>
  <text x="873" y="156" text-anchor="middle" font-size="11" fill="#16A34A">PDF/A-2b, sRGB</text>

  <rect x="818" y="346" width="110" height="64" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="873" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">press PDF</text>
  <text x="873" y="392" text-anchor="middle" font-size="11" fill="#16A34A">PDF/X-4, CMYK</text>

  <!-- Guard on the screen path -->
  <line x1="640" y1="252" x2="640" y2="192" stroke="#DC2626" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#uctp-ah-red)"/>
  <rect x="500" y="254" width="280" height="52" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="640" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">guard: L_CMYK_INTENT_MISMATCH</text>
  <text x="640" y="294" text-anchor="middle" font-size="11" fill="#B91C1C">a press tuple leaked into the PDF/A render is a lint warning</text>

  <!-- Footer -->
  <rect x="40" y="472" width="880" height="66" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="500" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">No RGB to CMYK conversion — plate values are authored; pdfx and tagged are mutually exclusive, so the press file is not tagged.</text>
  <text x="480" y="520" text-anchor="middle" font-size="12.5" fill="#475569">The engine's validatePdfX checks the press bytes in-process; a certified preflight still has the last word before press.</text>
</svg>
