<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ucsd-title ucsd-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="ucsd-title">Spot-colour press sheet with the dual claim</title>
  <desc id="ucsd-desc">Architecture: one Document tree, with tagged set to pdfa2b and pdfx set to pdfx4, declares three inks under print.spotColours and paints headings, a table zebra, an ink mix and one chart bar per ink with spot colour values. The tree flows into the lint gate, lintDocument, which reports L_SPOT_UNDECLARED, L_SPOT_INK_MIX and L_CHART_SERIES_COLORS and raises nothing for the dual claim, because L_PDFX_TAGGED_CONFLICT fires only for pdfa1b and pdfa3b. The clean model flows into renderToBytes, which writes a Separation colour space per spot value and a DeviceN space per ink mix, each with a tint transform to its CMYK alternate, and an XMP packet carrying both pdfaid and pdfxid. The result is one PDF holding both claims, a tagged structure tree, a TrimBox, a Trapped entry, a prtr output intent and the three plates Brand Blue, Warm Grey and Varnish. Two checks read the bytes: the engine's validatePdfX, imported from pdfnative, for the PDF/X-4 structure, and veraPDF for the PDF/A-2b claim. A guard pill under the lint gate notes that an undeclared ink fails the check before any byte exists.</desc>

  <defs>
    <marker id="ucsd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ucsd-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="ucsd-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="ucsd-ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Spot-colour press sheet with the dual claim</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">Named inks and one file for PDF/A-2b and PDF/X-4 — pdfnative-react v1.4.0</text>

  <!-- Component tree -->
  <rect x="40" y="110" width="210" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="145" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">&lt;Document tagged pdfx&gt;</text>
  <text x="145" y="162" text-anchor="middle" font-size="11.5" fill="#64748B">tagged="pdfa2b" pdfx="pdfx4"</text>
  <text x="145" y="180" text-anchor="middle" font-size="11.5" fill="#64748B">print.spotColours: 3 inks</text>
  <text x="145" y="198" text-anchor="middle" font-size="11.5" fill="#64748B">&lt;Heading color={{ spot }}&gt;</text>
  <text x="145" y="216" text-anchor="middle" font-size="11.5" fill="#64748B">zebra: { spot, tint: 0.15 }</text>
  <text x="145" y="234" text-anchor="middle" font-size="11.5" fill="#64748B">inks: { 'Brand Blue': 1, Varnish: .6 }</text>
  <text x="145" y="252" text-anchor="middle" font-size="11.5" fill="#64748B">&lt;Chart series colors&gt;:</text>
  <text x="145" y="270" text-anchor="middle" font-size="11.5" fill="#64748B">one ink per bar</text>

  <!-- Tree → lint gate -->
  <line x1="250" y1="205" x2="286" y2="205" stroke="#475569" stroke-width="1.75" marker-end="url(#ucsd-ah)"/>

  <!-- Lint gate -->
  <rect x="288" y="110" width="200" height="190" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="388" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">lintDocument(sheet)</text>
  <text x="388" y="162" text-anchor="middle" font-size="11.5" fill="#3B82F6">L_SPOT_UNDECLARED</text>
  <text x="388" y="180" text-anchor="middle" font-size="11.5" fill="#3B82F6">L_SPOT_INK_MIX</text>
  <text x="388" y="198" text-anchor="middle" font-size="11.5" fill="#3B82F6">L_CHART_SERIES_COLORS</text>
  <line x1="308" y1="212" x2="468" y2="212" stroke="#BFDBFE" stroke-width="1"/>
  <text x="388" y="234" text-anchor="middle" font-size="11.5" fill="#1D4ED8">dual claim: no finding —</text>
  <text x="388" y="252" text-anchor="middle" font-size="11.5" fill="#1D4ED8">L_PDFX_TAGGED_CONFLICT</text>
  <text x="388" y="270" text-anchor="middle" font-size="11.5" fill="#1D4ED8">only for pdfa1b / pdfa3b</text>

  <!-- Lint gate → renderer -->
  <line x1="488" y1="205" x2="524" y2="205" stroke="#475569" stroke-width="1.75" marker-end="url(#ucsd-ah)"/>

  <!-- Renderer -->
  <rect x="526" y="110" width="180" height="190" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="616" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730A3">renderToBytes(sheet)</text>
  <text x="616" y="162" text-anchor="middle" font-size="11.5" fill="#4F46E5">/Separation per { spot }</text>
  <text x="616" y="180" text-anchor="middle" font-size="11.5" fill="#4F46E5">/DeviceN per { inks }</text>
  <text x="616" y="198" text-anchor="middle" font-size="11.5" fill="#4F46E5">tint transforms to the</text>
  <text x="616" y="216" text-anchor="middle" font-size="11.5" fill="#4F46E5">CMYK alternates</text>
  <line x1="546" y1="230" x2="686" y2="230" stroke="#C7D2FE" stroke-width="1"/>
  <text x="616" y="252" text-anchor="middle" font-size="11.5" fill="#4F46E5">XMP: pdfaid + pdfxid</text>
  <text x="616" y="270" text-anchor="middle" font-size="11.5" fill="#4F46E5">structure tree + TrimBox</text>

  <!-- Renderer → PDF -->
  <line x1="706" y1="205" x2="742" y2="205" stroke="#16A34A" stroke-width="2" marker-end="url(#ucsd-ah-green)"/>

  <!-- One PDF, two claims -->
  <rect x="744" y="110" width="176" height="190" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="832" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">one PDF, two claims</text>
  <text x="832" y="162" text-anchor="middle" font-size="11.5" fill="#16A34A">PDF/A-2b + PDF/X-4</text>
  <text x="832" y="180" text-anchor="middle" font-size="11.5" fill="#16A34A">prtr output intent</text>
  <text x="832" y="198" text-anchor="middle" font-size="11.5" fill="#16A34A">/Trapped False, TrimBox</text>
  <line x1="764" y1="212" x2="900" y2="212" stroke="#BBF7D0" stroke-width="1"/>
  <text x="832" y="234" text-anchor="middle" font-size="11.5" fill="#15803D">plates: Brand Blue,</text>
  <text x="832" y="252" text-anchor="middle" font-size="11.5" fill="#15803D">Warm Grey, Varnish</text>
  <text x="832" y="270" text-anchor="middle" font-size="11.5" fill="#15803D">+ C M Y K colour bars</text>

  <!-- Declarations feeding the tree -->
  <line x1="145" y1="350" x2="145" y2="304" stroke="#475569" stroke-width="1.75" marker-end="url(#ucsd-ah)"/>
  <rect x="40" y="352" width="210" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="145" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">print.spotColours</text>
  <text x="145" y="396" text-anchor="middle" font-size="11" fill="#64748B">{ name: 'Brand Blue',</text>
  <text x="145" y="412" text-anchor="middle" font-size="11" fill="#64748B">alternate: [100, 44, 0, 0] }</text>

  <!-- Guard under the lint gate -->
  <line x1="388" y1="350" x2="388" y2="304" stroke="#DC2626" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#ucsd-ah-red)"/>
  <rect x="280" y="352" width="216" height="72" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="388" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">guard: L_SPOT_UNDECLARED</text>
  <text x="388" y="396" text-anchor="middle" font-size="11" fill="#B91C1C">an ink painted without a declaration</text>
  <text x="388" y="412" text-anchor="middle" font-size="11" fill="#B91C1C">fails the check before any byte exists</text>

  <!-- PDF → the two checks -->
  <path d="M790 300 C 790 326, 640 326, 640 350" fill="none" stroke="#2563EB" stroke-width="1.75" marker-end="url(#ucsd-ah-blue)"/>
  <line x1="860" y1="300" x2="860" y2="350" stroke="#2563EB" stroke-width="1.75" marker-end="url(#ucsd-ah-blue)"/>

  <rect x="540" y="352" width="200" height="72" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="640" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">validatePdfX(bytes)</text>
  <text x="640" y="396" text-anchor="middle" font-size="11" fill="#B45309">import from 'pdfnative'</text>
  <text x="640" y="412" text-anchor="middle" font-size="11" fill="#B45309">{ valid, errors, warnings }</text>

  <rect x="776" y="352" width="144" height="72" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="848" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">veraPDF</text>
  <text x="848" y="396" text-anchor="middle" font-size="11" fill="#B45309">PDF/A-2b profile</text>
  <text x="848" y="412" text-anchor="middle" font-size="11" fill="#B45309">the archival claim</text>

  <!-- Footer -->
  <rect x="40" y="472" width="880" height="66" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="500" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">No RGB to CMYK conversion — alternates are authored; outline colours and colour bars stay process; tagged: true skips the PDF/A pre-flight.</text>
  <text x="480" y="520" text-anchor="middle" font-size="12.5" fill="#475569">validatePdfX resolves every /Separation and /DeviceN alternate in-process; a certified preflight still has the last word before press.</text>
</svg>
