name: Font Reproducibility

# Proves that every bundled fonts/*-data.js regenerates byte-for-byte from the
# source font it declares, so the "DO NOT EDIT — Regenerate with: …" header in
# each module is true and a contributor who follows it gets the committed file.
#
# The modules had silently drifted before v1.8.0: eleven carried no ligature
# table at all, and three advertised roughly 2 650 code points their subsetted
# font could not actually draw. Nothing detected it, because nobody
# regenerated.
#
# The source fonts are pinned by google/fonts commit, notofonts release tag and
# SHA-256 in fonts/SOURCES.json; `npm run fonts:download` refuses any byte that
# differs and derives the five Latin subsets from the pinned variable font with
# the library's own subsetTTF() (code-point lists under fonts/subsets/), and
# `npm run verify:fonts` checks every TTF against the manifest — re-deriving
# the subsets — before it regenerates a module. Nothing under fonts/ttf/ is
# committed. The download is tens of megabytes, so the job runs on pull
# requests only when a font-related path changes, plus a weekly schedule that
# catches an upstream URL going away.

on:
  push:
    branches: [main, master]
    paths:
      - 'fonts/**'
      - 'fonts/SOURCES.json'
      - 'fonts/subsets/*.txt'
      - 'tools/build-font-data.cjs'
      - 'src/tools/font-compiler.ts'
      - 'src/fonts/font-subsetter.ts'
      - 'scripts/verify-fonts.ts'
      - 'scripts/download-fonts.ts'
      - 'scripts/build-latin-subsets.ts'
      - 'scripts/lib/latin-subsets.ts'
      - 'scripts/lib/font-sources.ts'
      - '.github/workflows/font-reproducibility.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'fonts/**'
      - 'fonts/SOURCES.json'
      - 'fonts/subsets/*.txt'
      - 'tools/build-font-data.cjs'
      - 'src/tools/font-compiler.ts'
      - 'src/fonts/font-subsetter.ts'
      - 'scripts/verify-fonts.ts'
      - 'scripts/download-fonts.ts'
      - 'scripts/build-latin-subsets.ts'
      - 'scripts/lib/latin-subsets.ts'
      - 'scripts/lib/font-sources.ts'
      - '.github/workflows/font-reproducibility.yml'
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: font-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the source fonts (pinned commit, SHA-256 checked) and derive the Latin subsets
        run: npm run fonts:download

      - name: Verify every module reproduces from its source font
        run: npm run verify:fonts

      - name: Report divergences
        if: failure()
        run: |
          {
            echo '## Font reproducibility'
            echo
            echo 'A bundled font module no longer matches what the generator produces'
            echo 'from the source font it declares, or a source font no longer matches'
            echo 'fonts/SOURCES.json. Regenerate it, then confirm nothing rendered'
            echo 'differently with `npm run verify:samples`.'
            echo
            echo '```json'
            npx tsx scripts/verify-fonts.ts --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
