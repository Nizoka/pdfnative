name: PDF/A Validation (veraPDF)

# Run the veraPDF reference validator against every sample PDF that claims
# PDF/A conformance in its XMP metadata. The job fails if any compliant claim
# is broken — guarding against PDF/A regressions.
#
# veraPDF is invoked as an external CI tool (Java CLI). pdfnative remains a
# zero-runtime-dependency library; veraPDF is not bundled or linked. The
# pinned release, its checksum and the install steps live in the composite
# action .github/actions/setup-verapdf, shared with publish.yml.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'fonts/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verapdf.yml'
      - '.github/actions/setup-verapdf/**'
      - '.github/checksums/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'fonts/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verapdf.yml'
      - '.github/actions/setup-verapdf/**'
      - '.github/checksums/**'
  # Allow manually running the workflow against any branch from the
  # GitHub Actions UI. Useful for verifying veraPDF integration before
  # opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verapdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verapdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-23: endpoints not baselined yet; block once a month of audit logs names them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned veraPDF release (greenfield), checksummed, so CI and the
      # documented local setup validate against the same validator version —
      # a floating "latest" URL can silently change the rule set between two
      # runs of the same commit. Bump deliberately in the action's default.
      - name: Setup veraPDF
        id: verapdf
        uses: ./.github/actions/setup-verapdf

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Generate sample PDFs
        run: npm run test:generate

      # v1.1.0+: veraPDF is blocking. Every PDF/A-claiming sample (detected
      # automatically via pdfaid:part in XMP) must validate against the
      # corresponding PDF/A profile (1b, 2b, 2u, 3b). Non-PDF/A files are
      # skipped by scripts/validate-pdfa.ts and never trigger failures.
      - name: Validate PDF/A claims (blocking)
        env:
          VERAPDF_HOME: ${{ steps.verapdf.outputs.home }}
        run: npm run validate:pdfa
