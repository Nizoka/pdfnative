name: CodeQL

# No path filter (v1.9.0): a weekly schedule plus every push and pull request,
# so the FAQ's "CodeQL on every pull request and push" is literally true and a
# code-scanning rule can one day wait for its results on every pull request.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write permission at the JOB level only (OpenSSF Scorecard
    # Token-Permissions, zizmor excessive-permissions): a second job added to
    # this file would not inherit the right to write security events.
    permissions:
      security-events: write # Upload the analysis to code scanning.
      actions: read # Read the workflow run the analysis belongs to.
      contents: read # Read the source.

    # `actions` reads the workflows themselves (injection, untrusted checkout,
    # excessive permissions); `javascript-typescript` the engine and the
    # scripts. Neither needs a build: CodeQL extracts both from source, so the
    # build step of the template is gone. `security-extended` adds the
    # lower-precision queries a library that parses untrusted input wants.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: javascript-typescript, build-mode: none }

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-23: the CodeQL bundle and its query packs come from hosts not baselined yet

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
