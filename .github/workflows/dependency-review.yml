name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# pdfnative has zero runtime dependencies, so this covers the dev toolchain
# (and any attempt to add a runtime one).
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense
          comment-summary-in-pr: on-failure
