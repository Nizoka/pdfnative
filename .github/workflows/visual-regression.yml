name: Visual Regression

# Guards the text-rendering pipeline (shaping → PDF emission → font embedding)
# against visual regressions. Builds the extreme-script fixtures from the
# current source with the real bundled fonts, then runs the glyph-position
# snapshot guard and the rendered-glyph pixel-diff tests against the committed
# baselines under tests/visual/baselines/.
#
# Gated on the modules that can change rendered glyph geometry so unrelated
# changes don't pay the cost.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/shaping/**'
      - 'src/fonts/**'
      - 'src/core/**'
      - 'fonts/**'
      - 'tests/visual/**'
      - '.github/workflows/visual-regression.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/shaping/**'
      - 'src/fonts/**'
      - 'src/core/**'
      - 'fonts/**'
      - 'tests/visual/**'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-23: endpoints not baselined yet; block once a month of audit logs names them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run visual-regression suite (snapshot + pixel diff)
        run: npx vitest run tests/visual/

      - name: Upload rendered bitmaps on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-pngs
          path: tests/visual/baselines/
          retention-days: 7
