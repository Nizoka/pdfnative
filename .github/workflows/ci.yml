name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      # The USE character table is generated from the vendored UCD files.
      # A hand-edit to the table, or a UCD upgrade without a regeneration,
      # would otherwise ship silently.
      - name: Verify the Unicode table matches its generator
        run: npm run verify:unicode

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # `sideEffects: false` is a claim a bundler acts on; this probes dist/
      # so a module-level side effect cannot silently ship to every consumer.
      - name: Verify the bundle tree-shakes
        run: npm run verify:bundle

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
