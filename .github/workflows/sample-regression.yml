name: Sample Regression

# Guards the whole emission pipeline against unintended output changes.
# Regenerates all sample PDFs from the current source and fingerprints them
# against the committed chain at tests/regression/baselines/samples.sha256.json.
#
# The baseline is a CHAIN, not a snapshot: every entry records the release its
# reference was captured at (`since`) and keeps it across rebaselines, so
# 1.8.0 is still held to the bytes v1.7.0 emitted. Samples introduced by the
# release under development have no earlier reference and are reported without
# failing (`--strict` opts into failing on those too).
#
# Most samples are compared byte-for-byte: `setDefaultCreationDate()` pins the
# creation instant and the harness pins TZ=UTC, which makes unencrypted output
# a pure function of its inputs. The encrypted samples can never repeat their
# bytes (CSPRNG file key and AES IVs, ISO 32000-1 §7.6), so those are compared
# through a canonical projection of the decrypted document instead.
#
# ── Why there is no `paths:` filter ──────────────────────────────────
# This job is meant to be a REQUIRED status check. A path-filtered workflow
# simply does not run on a pull request that touches none of its paths, and a
# required check that never reports leaves the pull request stuck on
# "Expected — waiting for status to be reported", forever unmergeable. So the
# workflow always runs and decides internally whether the expensive work is
# warranted, which keeps the check reported on every pull request.
#
# Blocking on merge is a repository setting, not a file: add "sample-regression"
# to the required status checks of the branch protection rule (or ruleset) for
# `main`. Without that, a failure shows a red cross but does not prevent merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Needed to diff against the pull request's base commit.
          fetch-depth: 0

      - name: Decide whether emitted output can have changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --name-only "$base"...HEAD \
            | grep -Eq '^(src/|fonts/|scripts/|tests/regression/|package\.json$|package-lock\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No change under src/, fonts/, scripts/ or the manifests — emitted output cannot have changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Generate samples
        if: steps.scope.outputs.run == 'true'
        run: npm run test:generate

      - name: Verify samples against the baseline chain
        if: steps.scope.outputs.run == 'true'
        run: npx tsx scripts/verify-samples.ts

      - name: Report divergences
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo '## Sample regression'
            echo
            echo 'A tracked sample no longer emits what its reference release emitted.'
            echo 'If the change is intended, say so in the release notes and rebaseline with:'
            echo
            echo '```'
            echo 'npm run test:generate && npx tsx scripts/verify-samples.ts --update'
            echo '```'
            echo
            echo '```json'
            npx tsx scripts/verify-samples.ts --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diverged samples on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sample-regression-output
          path: test-output/
          retention-days: 7
